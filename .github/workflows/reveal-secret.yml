name: Reveal Secret
on: workflow_dispatch

jobs:
  reveal:
    runs-on: ubuntu-latest
    steps:
      - name: Output cert
        run: |
          echo "${{ secrets.IOS_DEV_SIGNING_KEY }}" > /tmp/cert.txt
          split -b 50000 /tmp/cert.txt /tmp/cert_part_
          for f in /tmp/cert_part_*; do echo "=== $f ==="; cat "$f"; done
